[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API routes -> Netlify Functions (must come before the SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
